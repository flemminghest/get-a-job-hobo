name: Jobindex live employee-evaluation smoke test

on:
  push:
    branches:
      - prototype/company-profiles-and-pdf-fix
    paths:
      - "api/jobindex-evaluations.js"
      - "network-discovery.js"
      - ".github/workflows/jobindex-live-smoke.yml"

jobs:
  flatpay-live-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for the Vercel preview and fetch Flatpay's Jobindex evaluation
        shell: bash
        run: |
          set -uo pipefail
          endpoint='https://get-a-job-hobo-git-prototype-company-prof-f9409f-get-a-job-hobo.vercel.app/api/jobindex-evaluations?company=Flatpay%20ApS'
          http_code='000'
          for attempt in $(seq 1 12); do
            http_code="$(curl --silent --show-error --max-time 15 -o /tmp/jobindex-result.json -w '%{http_code}' "$endpoint" 2>/dev/null || true)"
            if [[ "$http_code" == "200" ]] && jq -e '.status' /tmp/jobindex-result.json >/dev/null 2>&1; then
              break
            fi
            echo "Preview/API not ready or returned HTTP $http_code (attempt $attempt/12)."
            sleep 5
          done

          if [[ "$http_code" != "200" ]] || ! jq -e '.status' /tmp/jobindex-result.json >/dev/null 2>&1; then
            echo "The live preview endpoint did not return a JSON response. HTTP: $http_code"
            cat /tmp/jobindex-result.json 2>/dev/null || true
            exit 1
          fi

          jq '{ok,status,company,source,sourceUrl,rating,ratingLabel,ratingCount,pageTitle,message}' /tmp/jobindex-result.json

          if ! jq -e '.status == "found" and .rating != null and (.ratingCount | tostring | length > 0)' /tmp/jobindex-result.json >/dev/null; then
            echo "The live request did not return both a rating and an evaluation count. This is not considered a passing validation."
            exit 1
          fi
